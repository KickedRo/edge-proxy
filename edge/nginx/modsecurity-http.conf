# Included into the http block of nginx.conf (see the Dockerfile). It lives outside conf.d on purpose:
# in the split nginx-proxy layout conf.d is a shared volume written by docker-gen.
modsecurity on;
modsecurity_rules_file /etc/nginx/modsec/main.conf;
# The request ID is the transaction ID in the audit log ("unique_id"), so the reference on the block page (and
# $request_id in access logs) finds the audit entry.
modsecurity_transaction_id "$request_id";
