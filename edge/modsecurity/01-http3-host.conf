# HTTP/3 requests carry their authority in the :authority pseudo-header. nginx does not put it in the header list the
# ModSecurity-nginx connector hands to libmodsecurity, so ModSecurity sees no Host header and the CRS rule 920280
# ("Request Missing a Host Header") would refuse every HTTP/3 request, legitimate ones included. Upstream:
# https://github.com/owasp-modsecurity/ModSecurity-nginx/issues/305 (the workaround below),
# https://github.com/owasp-modsecurity/ModSecurity-nginx/pull/364 (the fix, not in the connector release we build).
# Remove this rule when the connector ships the fix.
#
# Scope: this removes 920280 for HTTP/3 requests only; HTTP/1.x and HTTP/2 are checked as before. Cost: over HTTP/3,
# CRS checks that read the Host header see none. Every other rule inspects the request as usual.
#
# To restore the CRS behaviour for HTTP/3 anyway, put `SecRuleRemoveById 10002` in a file in custom.d.
# ID 10002 is in the image's own range (10001-10099), below the 10100-99999 range left for your rules.
SecRule REQUEST_PROTOCOL "@streq HTTP/3.0" \
    "id:10002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920280"
