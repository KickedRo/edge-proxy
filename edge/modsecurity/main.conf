# ModSecurity entry point, loaded by nginx (nginx/modsecurity-http.conf). Order matters.

# Fixed settings (recommended ModSecurity configuration), then the CRS's own setup file, then the
# settings derived from MODSEC_* variables (rendered from templates/modsecurity.conf.template at start).
Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/modsec/crs/crs-setup.conf
Include /etc/nginx/modsec/rendered/modsecurity.conf

# Exemption for ACME HTTP-01 challenges.
Include /etc/nginx/modsec/00-acme-exclusion.conf

# Site exclusions and extra rules: mount your own directory at custom.d (may be empty).
# libmodsecurity refuses an Include glob that matches nothing, so the globs below (custom.d*, after.d*)
# also match the image's own custom.d-empty / after.d-empty, each holding one empty file.
Include /etc/nginx/modsec/custom.d*/*.conf

# OWASP Core Rule Set.
Include /etc/nginx/modsec/crs/rules/*.conf

# Settings derived from MODSEC_* variables that need the CRS rules to exist first (blocking status).
Include /etc/nginx/modsec/rendered/modsecurity-after-crs.conf

# Rules that must run after the CRS (for example response exclusions): mount your own directory (may be empty).
Include /etc/nginx/modsec/after.d*/*.conf
