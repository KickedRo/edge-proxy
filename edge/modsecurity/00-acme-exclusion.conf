# ACME HTTP-01 validation requests (certificate issuance) are not inspected and not audit-logged.
# Only requests shaped exactly like an RFC 8555 validation are exempt: GET or HEAD, and the RAW request
# target (REQUEST_URI is the undecoded, un-normalised target, query string included) is
# /.well-known/acme-challenge/<token> with a base64url token: no query string, no percent-encoding, no
# further slashes or dot-segments. Anything else to that prefix (traversal, queries, POST) is inspected
# like any other request. A prefix match would let attacks through on sites that route unknown paths to
# an application, or whose backend normalises the URI.
# ID 10001 is in ModSecurity's local-use range (1-99999); the CRS uses 9xxxxx.
SecRule REQUEST_URI "@rx ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off,\
    ctl:auditEngine=Off,\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:GET|HEAD)$"
