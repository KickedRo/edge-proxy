# ACME HTTP-01 validation requests (certificate issuance) are not inspected and not audit-logged.
# Only a request shaped exactly like an RFC 8555 validation is exempt. Every condition narrows what an
# uninspected request can deliver to an application that routes unknown paths:
#  - protocol HTTP/1.0 or 1.1: validation is plain HTTP/1.x on port 80. HTTP/2 can carry a body without
#    Content-Length or Transfer-Encoding (DATA frames), so the header checks alone would not stop it;
#  - method GET or HEAD;
#  - the raw request target is /.well-known/acme-challenge/<token> with a base64url token: no query string,
#    no percent-encoding, no further slashes, dot-segments or fragment;
#  - no Cookie, Content-Length or Transfer-Encoding header (real validators send none).
# Anything else to that prefix is inspected like any other request.
#
# The target is matched with REQUEST_URI_RAW, the target exactly as sent. REQUEST_URI must NOT be used:
# in libmodsecurity 3.0.17 it is URL-decoded and fragment-stripped. The anchors are \A and \z, never ^ and
# $: libmodsecurity compiles every regex multiline, so ^ and $ also match at a decoded newline (%0A) anywhere
# in the target, which would exempt any path.
#
# To remove this exemption, put `SecRuleRemoveById 10001` in a file in custom.d (loaded after this file).
# ID 10001 is in ModSecurity's local-use range (1-99999); the CRS uses 9xxxxx.
SecRule REQUEST_URI_RAW "@rx \A/\.well-known/acme-challenge/[A-Za-z0-9_-]+\z" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off,\
    ctl:auditEngine=Off,\
    chain"
    SecRule REQUEST_PROTOCOL "@rx \AHTTP/1\.[01]\z" "chain"
    SecRule REQUEST_METHOD "@rx \A(?:GET|HEAD)\z" "chain"
    SecRule &REQUEST_HEADERS:Cookie "@eq 0" "chain"
    SecRule &REQUEST_HEADERS:Content-Length "@eq 0" "chain"
    SecRule &REQUEST_HEADERS:Transfer-Encoding "@eq 0"
