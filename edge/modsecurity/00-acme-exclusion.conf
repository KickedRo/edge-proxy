# ACME HTTP-01 challenge requests (certificate issuance) are not inspected and not audit-logged.
# ID 10001 is in ModSecurity's local-use range (1-99999); the CRS uses 9xxxxx.
SecRule REQUEST_URI "@beginsWith /.well-known/acme-challenge/" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off,\
    ctl:auditEngine=Off"
