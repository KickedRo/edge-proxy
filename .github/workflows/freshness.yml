name: freshness

# Alarm for a pipeline that silently stopped: fails, and opens an "Image stale or behind upstream" issue (unless one
# is open), when a published :latest is older than max_age_days (default 8: the build publishes at least every
# Monday) or its nginx is older than upstream's current mainline; closes that issue once the images are healthy.
on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Maximum age of :latest in whole days"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

# bash -eo pipefail for every run step (the implicit default shell has no pipefail).
defaults:
  run:
    shell: bash

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      packages: read # read the published :latest images, in case they are not public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve upstream versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve_versions.py --out "$RUNNER_TEMP/versions.env" && cat "$RUNNER_TEMP/versions.env"
      # Read access to the packages, in case they are not public.
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Check the published images
        env:
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
        run: |
          for image in edge-proxy edge-proxy-gen; do
            docker buildx imagetools inspect "ghcr.io/kickedro/$image:latest" --format '{{json .Image}}' \
              > "$RUNNER_TEMP/$image.json"
          done
          python3 scripts/check_freshness.py --resolved "$RUNNER_TEMP/versions.env" --max-age-days "${MAX_AGE_DAYS:-8}" \
            "edge=$RUNNER_TEMP/edge-proxy.json" "gen=$RUNNER_TEMP/edge-proxy-gen.json" | tee -a "$GITHUB_STEP_SUMMARY"

  # Any result of the check other than success opens the issue: a failure, and also a cancellation (how a job that
  # hit its timeout-minutes ends). Only issues opened by this workflow's token (github-actions[bot]) count, so an issue
  # anyone can open with the same title does not mute the alarm. Only fixed text and the run's URL go into the issue.
  report:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open and close the "Image stale or behind upstream" issue
    steps:
      - name: Open or close the "Image stale or behind upstream" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Image stale or behind upstream"
          open=$(gh issue list --state open --author 'github-actions[bot]' --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number")
          echo "check: $RESULT; open issue: ${open:-none}"
          if [ "$RESULT" = success ]; then
            for n in $open; do
              gh issue close "$n" --comment "The freshness check passed again: $RUN_URL"
            done
          elif [ -z "$open" ]; then
            gh issue create --title "$title" \
              --body "The freshness check did not pass ($RESULT): $RUN_URL. It is closed by the next passing check."
          fi

  # Keep-alive (scheduled runs only): GitHub disables the scheduled workflows of a public repository after 60 days
  # without repository activity, which would stop the daily build and this alarm together, silently. This re-enables
  # both workflows on every scheduled run (build.yml does the same). GitHub does not document whether enabling an
  # enabled workflow resets the 60-day timer; it is the mechanism keep-alive tools use, and external monitoring of the
  # published images is the backstop (both described in the maintenance docs). No commits are made (main is
  # protected). A failing call fails this job, so the run shows as failed.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # PUT /repos/{owner}/{repo}/actions/workflows/{id}/enable
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in build.yml freshness.yml; do
            gh api --method PUT "repos/$GH_REPO/actions/workflows/$workflow/enable"
            echo "enabled: $workflow"
          done
