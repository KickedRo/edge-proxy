name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      security_epoch:
        description: "Override SECURITY_EPOCH (default: today's UTC date, YYYYMMDD). A new value re-runs the image security-upgrade layers."
        required: false
        type: string
      force_publish:
        description: "Publish a new patch version even if the build key equals the one of :latest (on main only)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# bash -eo pipefail for every run step (the implicit default shell has no pipefail).
defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Official Trivy image, pinned by digest (0.76.2). The vulnerability DB comes from the ECR mirror first,
  # because ghcr.io rate-limits anonymous DB downloads.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  # BuildKit for every buildx builder of this workflow (build-test, publish, and the publish rehearsal, which reads
  # this variable): v0.34.2, the release Docker's buildx-stable-1 channel points to (on 2026-11-13), pinned by digest
  # instead of following that floating tag, because it holds the ghcr.io push credentials and writes the SBOM and
  # provenance that get signed. Updated by hand to what buildx-stable-1 resolves to (see the maintenance notes).
  BUILDKIT_IMAGE: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

jobs:
  # Looks up the newest upstream versions (nginx, ModSecurity, CRS, docker-gen, nginx-proxy pin) once; later
  # jobs build from this one file, so everything in a run uses the same versions.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      epoch: ${{ steps.date.outputs.epoch }}
      line: ${{ steps.line.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve upstream versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve_versions.py --out versions.env && cat versions.env
      # The UTC date, taken once so every job of the run agrees. SECURITY_EPOCH: build argument consumed only by
      # the security-upgrade layers of the images (apt upgrade, docker-gen's vulnerability-driven module upgrades),
      # so they re-run once a day while the expensive layers (the ModSecurity compile) stay cached.
      - name: Security epoch
        id: date
        env:
          OVERRIDE: ${{ inputs.security_epoch }}
        run: |
          epoch="${OVERRIDE:-$(date -u +%Y%m%d)}"
          case "$epoch" in *[!A-Za-z0-9._-]* | "") echo "bad security epoch" >&2; exit 1 ;; esac
          echo "epoch=$epoch" | tee -a "$GITHUB_OUTPUT"
      # The release line MAJOR.MINOR from VERSION, read here so that a malformed VERSION fails every run, pull
      # requests included. The publish job adds the patch number when it publishes.
      - name: Version line
        id: line
        run: |
          line=$(scripts/publish_tested.sh line VERSION)
          echo "line=$line" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versions
          path: versions.env
          if-no-files-found: error

  # Builds both images, tests and scans them, computes the content build key and rehearses publishing against a
  # local registry. On main (not for pull requests) the tested images go to the publish job as an artifact.
  build-test:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      key: ${{ steps.key.outputs.key }}
      sums: ${{ steps.tested.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: versions
      # The version label is LINE-dev here (the release version is not known before publishing); the publish job's
      # push sets it to the version it publishes, X.Y.Z.
      - name: Build arguments and labels from the resolved versions
        id: args
        env:
          EPOCH: ${{ needs.resolve.outputs.epoch }}
          LINE: ${{ needs.resolve.outputs.line }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          versions=$(paste -sd';' versions.env)
          labels() { # LICENSES
            echo "org.opencontainers.image.source=$SOURCE"
            echo "org.opencontainers.image.revision=$REVISION"
            echo "org.opencontainers.image.version=$LINE-dev"
            echo "org.opencontainers.image.licenses=$1"
            echo "org.kickedro.versions=$versions"
          }
          {
            echo 'edge<<EOF'
            grep -E '^(NGINX_VERSION|MODSECURITY_VERSION|MODSECURITY_NGINX_VERSION|CRS_VERSION|NGINX_PROXY_REF)=' versions.env
            echo "SECURITY_EPOCH=$EPOCH"
            echo 'EOF'
            echo 'gen<<EOF'
            grep -E '^(GO_VERSION|DOCKER_GEN_VERSION|NGINX_PROXY_REF)=' versions.env
            echo "SECURITY_EPOCH=$EPOCH"
            echo 'EOF'
            echo 'edge_labels<<EOF'
            labels "MIT AND BSD-2-Clause AND Apache-2.0"
            echo 'EOF'
            echo 'gen_labels<<EOF'
            labels "MIT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Unit tests and ignore-file check
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          tests/release_test.sh
          python3 scripts/check_trivyignore.py .trivyignore.yaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build edge
        id: build-edge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: edge
          build-contexts: repo=. # LICENSE and NOTICE, shipped in the image
          load: true
          tags: edge-proxy:ci
          build-args: ${{ steps.args.outputs.edge }}
          labels: ${{ steps.args.outputs.edge_labels }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max
      - name: Build gen
        id: build-gen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gen
          build-contexts: repo=. # LICENSE and NOTICE, shipped in the image
          load: true
          tags: edge-proxy-gen:ci
          build-args: ${{ steps.args.outputs.gen }}
          labels: ${{ steps.args.outputs.gen_labels }}
          cache-from: type=gha,scope=gen
          cache-to: type=gha,scope=gen,mode=max

      - name: Smoke test edge
        run: tests/edge_smoke.sh edge-proxy:ci
      - name: Smoke test edge with gen (split layout)
        run: tests/split_smoke.sh edge-proxy:ci edge-proxy-gen:ci
      - name: Long-lived connections smoke test
        run: tests/streaming_smoke.sh edge-proxy:ci edge-proxy-gen:ci
      - name: Hardening smoke test
        run: tests/hardening_smoke.sh edge-proxy:ci

      # Fails on any fixable HIGH or CRITICAL finding that .trivyignore.yaml does not list. Scans the saved
      # image archives, so Trivy needs no access to the Docker socket. These archives are what gets published.
      - name: Trivy scan
        run: |
          mkdir "$RUNNER_TEMP/scan"
          docker save edge-proxy:ci -o "$RUNNER_TEMP/scan/edge.tar"
          docker save edge-proxy-gen:ci -o "$RUNNER_TEMP/scan/gen.tar"
          docker pull -q "$TRIVY_IMAGE" >/dev/null
          docker volume create trivy-cache >/dev/null   # one vulnerability DB download for both scans
          status=0
          for image in edge gen; do
            echo "::group::trivy $image"
            docker run --rm -e TRIVY_DB_REPOSITORY -e TRIVY_NO_PROGRESS=true \
              -e TRIVY_CACHE_DIR=/cache -v trivy-cache:/cache \
              -v "$RUNNER_TEMP/scan:/scan:ro" -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
              "$TRIVY_IMAGE" image --input "/scan/$image.tar" \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile /.trivyignore.yaml || status=1
            echo "::endgroup::"
          done
          exit "$status"

      # The content build key (scripts/build_key.sh): what is in the images, stable from day to day while nothing
      # meaningful changed. The publish job compares it with the key of the published :latest. Of the builds'
      # metadata only the provenance materials (base images and downloads with digests) are passed on: the rest
      # holds the whole GitHub event payload, which would flood the log.
      - name: Build key
        id: key
        env:
          EDGE_MATERIALS: ${{ toJSON(fromJSON(steps.build-edge.outputs.metadata)['buildx.build.provenance'].materials) }}
          GEN_MATERIALS: ${{ toJSON(fromJSON(steps.build-gen.outputs.metadata)['buildx.build.provenance'].materials) }}
        run: |
          jq -n --argjson m "$EDGE_MATERIALS" '{"buildx.build.provenance": {materials: $m}}' > "$RUNNER_TEMP/edge-metadata.json"
          jq -n --argjson m "$GEN_MATERIALS" '{"buildx.build.provenance": {materials: $m}}' > "$RUNNER_TEMP/gen-metadata.json"
          key=$(BUILD_KEY_INPUTS="$RUNNER_TEMP/build-key-inputs.txt" scripts/build_key.sh versions.env \
            edge-proxy:ci "$RUNNER_TEMP/edge-metadata.json" edge-proxy-gen:ci "$RUNNER_TEMP/gen-metadata.json")
          echo "::group::build key inputs"
          cat "$RUNNER_TEMP/build-key-inputs.txt"
          echo "::endgroup::"
          echo "build key: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Build key test
        run: |
          tests/build_key_test.sh versions.env edge-proxy:ci "$RUNNER_TEMP/edge-metadata.json" \
            edge-proxy-gen:ci "$RUNNER_TEMP/gen-metadata.json"
      # What is in the images, for the release manifest and notes: the upstream versions, the Debian packages (the
      # build key's inputs) and docker-gen's Go version and modules (a file in the gen image).
      - name: Contents of the tested images
        run: |
          mkdir "$RUNNER_TEMP/tested"
          docker run --rm --pull=never --network none --entrypoint cat edge-proxy-gen:ci \
            /usr/local/share/doc/docker-gen/go-modules.txt > "$RUNNER_TEMP/go-modules.txt"
          python3 scripts/release_notes.py contents --versions versions.env \
            --key-inputs "$RUNNER_TEMP/build-key-inputs.txt" --gen-modules "$RUNNER_TEMP/go-modules.txt" \
            --out "$RUNNER_TEMP/tested/contents.json"

      # What was tested: the archives Trivy scanned and the identity (layer diff IDs + configuration) of the images
      # the smoke tests ran. The publish job pushes these archives and checks the pushed images against these
      # identities (scripts/publish_tested.sh).
      - name: Record the tested images
        id: tested
        run: |
          mv "$RUNNER_TEMP/scan/edge.tar" "$RUNNER_TEMP/scan/gen.tar" "$RUNNER_TEMP/tested/"
          scripts/publish_tested.sh identity edge-proxy:ci > "$RUNNER_TEMP/tested/edge.json"
          scripts/publish_tested.sh identity edge-proxy-gen:ci > "$RUNNER_TEMP/tested/gen.json"
          cd "$RUNNER_TEMP/tested"
          sha256sum edge.tar gen.tar edge.json gen.json contents.json | tee "$RUNNER_TEMP/SHA256SUMS"
          {
            echo 'sums<<EOF'
            cat "$RUNNER_TEMP/SHA256SUMS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Rehearse publishing (local registry, nothing leaves the runner)
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          t="$RUNNER_TEMP/tested"
          tests/publish_rehearsal.sh "$t/edge.tar" "$t/edge.json" "$t/gen.tar" "$t/gen.json" "$KEY"
      - name: Hand the tested images to the publish job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-images
          path: |
            ${{ runner.temp }}/tested/edge.tar
            ${{ runner.temp }}/tested/gen.tar
            ${{ runner.temp }}/tested/edge.json
            ${{ runner.temp }}/tested/gen.json
            ${{ runner.temp }}/tested/contents.json
          if-no-files-found: error
          retention-days: 1

  # Publishes the tested images, unchanged, when their content differs from :latest (build key), when the VERSION
  # line has no release yet, or on request, as the next version of that line (X.Y.Z, shared by both images). Only on
  # main, never for pull requests, and only after build-test passed (smoke tests, Trivy gate). Outputs: published
  # (true only when the images are pushed, signed, attested and tagged), version and the two pushed digests; the
  # release manifest goes to the release job as the artifact release-manifest.
  publish:
    needs: [resolve, build-test]
    if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      packages: write # read :latest and version tags, push to ghcr.io, store signature and attestation there
      id-token: write # GitHub OIDC token for keyless cosign signing and the provenance attestation
      attestations: write # store the provenance attestation on GitHub
    outputs:
      published: ${{ steps.tag.outputs.published == 'true' }}
      version: ${{ steps.version.outputs.version }}
      edge_digest: ${{ steps.push.outputs.edge }}
      gen_digest: ${{ steps.push.outputs.gen }}
    env:
      EDGE_REPOSITORY: ghcr.io/kickedro/edge-proxy
      GEN_REPOSITORY: ghcr.io/kickedro/edge-proxy-gen
      KEY: ${{ needs.build-test.outputs.key }}
      LINE: ${{ needs.resolve.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      # provenance-add-gha=false: buildx's provenance on the published images (public, permanent) leaves out the
      # GitHub event payload (triggering account, commit authors); GitHub's signed provenance attestation below
      # records repository, workflow, commit and run.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
            provenance-add-gha=false
      # The git release tags (vX.Y.Z) made so far, read from the repository on GitHub, not from the checkout (which
      # has no tags). With the version labels of the :latest images they tell whether the VERSION line has a release
      # and which patch comes next. A failed lookup fails the job: no list means no decision.
      - name: Release tags so far
        run: |
          git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 'refs/tags/v*' \
            | sed 's#.*refs/tags/##' > "$RUNNER_TEMP/tags.txt"
          echo "$(wc -l < "$RUNNER_TEMP/tags.txt") git tags v*:"
          cat "$RUNNER_TEMP/tags.txt"
      - name: Publish or skip
        id: decide
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish == true }}
        run: |
          publish=$(scripts/publish_tested.sh decide "$KEY" "$LINE" "$RUNNER_TEMP/tags.txt" "$FORCE_PUBLISH" \
            "$EDGE_REPOSITORY" "$GEN_REPOSITORY")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = false ]; then
            echo "unchanged, skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # A run that publishes nothing still requires the version the :latest images carry to have its Release (its git
      # tag vX.Y.Z, which publishing the Release creates). A release job that failed leaves none: this keeps the run
      # red, and the "Build failed" issue open, until that job is re-run (no repair here; docs/maintenance.md).
      - name: The published version has its Release
        if: steps.decide.outputs.publish == 'false'
        run: scripts/publish_tested.sh released "$RUNNER_TEMP/tags.txt" "$EDGE_REPOSITORY" "$GEN_REPOSITORY"

      - if: steps.decide.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
          path: ${{ runner.temp }}/tested
      - name: Check the artifact is what build-test tested
        if: steps.decide.outputs.publish == 'true'
        env:
          SUMS: ${{ needs.build-test.outputs.sums }}
        run: |
          cd "$RUNNER_TEMP/tested"
          printf '%s\n' "$SUMS" > "$RUNNER_TEMP/SHA256SUMS"
          [ "$(wc -l < "$RUNNER_TEMP/SHA256SUMS")" = 5 ] || { echo "expected 5 checksums from build-test" >&2; exit 1; }
          sha256sum --strict -c "$RUNNER_TEMP/SHA256SUMS"
      # The version of this publish, computed now (not when the pull request was tested): the next patch of the
      # VERSION line after its releases (git tags, :latest version labels), skipping any version either repository
      # already has as a tag, so a version is never re-used; LINE.0 for a line without a release. The images get it
      # as their version label and their version tag.
      - name: Version
        id: version
        if: steps.decide.outputs.publish == 'true'
        run: |
          version=$(scripts/publish_tested.sh next-version "$LINE" "$RUNNER_TEMP/tags.txt" \
            "$EDGE_REPOSITORY" "$GEN_REPOSITORY")
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
      - name: Push by digest, with SBOM and provenance; same-bits check
        id: push
        if: steps.decide.outputs.publish == 'true'
        env:
          PROVENANCE_BUILDER_ID: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          t="$RUNNER_TEMP/tested"
          edge=$(scripts/publish_tested.sh push "$t/edge.tar" "$t/edge.json" "$EDGE_REPOSITORY" "$KEY" "$VERSION")
          gen=$(scripts/publish_tested.sh push "$t/gen.tar" "$t/gen.json" "$GEN_REPOSITORY" "$KEY" "$VERSION")
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
          echo "gen=$gen" >> "$GITHUB_OUTPUT"
      - if: steps.decide.outputs.publish == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign (keyless, GitHub OIDC)
        if: steps.decide.outputs.publish == 'true'
        env:
          EDGE_DIGEST: ${{ steps.push.outputs.edge }}
          GEN_DIGEST: ${{ steps.push.outputs.gen }}
        run: |
          cosign sign --yes "$EDGE_REPOSITORY@$EDGE_DIGEST"
          cosign sign --yes "$GEN_REPOSITORY@$GEN_DIGEST"
      - name: Provenance attestation (edge)
        if: steps.decide.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.EDGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.edge }}
          push-to-registry: true
          # Storage records (the organization's "Linked Artifacts" page) would need artifact-metadata: write.
          create-storage-record: false
      - name: Provenance attestation (gen)
        if: steps.decide.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GEN_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.gen }}
          push-to-registry: true
          # Storage records (the organization's "Linked Artifacts" page) would need artifact-metadata: write.
          create-storage-record: false
      # The release manifest (version, commit, build key, digests, upstream versions, packages, Go modules), attached
      # to the GitHub Release by the release job, which holds contents: write (this job never does). Made before the
      # tags move, so a failure here leaves no tagged version without its manifest; a re-run of this job replaces the
      # artifact.
      - name: Release manifest
        if: steps.decide.outputs.publish == 'true'
        env:
          EDGE_DIGEST: ${{ steps.push.outputs.edge }}
          GEN_DIGEST: ${{ steps.push.outputs.gen }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          python3 scripts/release_notes.py manifest --contents "$RUNNER_TEMP/tested/contents.json" \
            --version "$VERSION" --commit "$COMMIT" --key "$KEY" \
            --edge "$EDGE_REPOSITORY@$EDGE_DIGEST" --gen "$GEN_REPOSITORY@$GEN_DIGEST" \
            --out "$RUNNER_TEMP/release/manifest.json"
      - if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release/manifest.json
          if-no-files-found: error
          retention-days: 30 # as long as GitHub allows a re-run of the release job (docs/maintenance.md)
          overwrite: true
      # Tags last: :latest and the line's MAJOR.MINOR tag move only to images that passed the same-bits check and are
      # signed and attested. The version tag X.Y.Z is new (publish_tested.sh refuses to move one).
      - name: Tag
        id: tag
        if: steps.decide.outputs.publish == 'true'
        env:
          EDGE_DIGEST: ${{ steps.push.outputs.edge }}
          GEN_DIGEST: ${{ steps.push.outputs.gen }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/publish_tested.sh tag "$EDGE_REPOSITORY" "$EDGE_DIGEST" "$VERSION" "${VERSION%.*}" latest
          scripts/publish_tested.sh tag "$GEN_REPOSITORY" "$GEN_DIGEST" "$VERSION" "${VERSION%.*}" latest
          echo "published=true" >> "$GITHUB_OUTPUT"
          {
            echo "published version \`$VERSION\` (build key \`$KEY\`), tags \`$VERSION\`, \`${VERSION%.*}\`, \`latest\`:"
            echo "- \`$EDGE_REPOSITORY@$EDGE_DIGEST\`"
            echo "- \`$GEN_REPOSITORY@$GEN_DIGEST\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The GitHub Release vX.Y.Z of what the publish job published (scripts/release.sh): a draft with the notes, the
  # asset manifest.json, then publication (marked latest unless a higher version already has a Release), which creates
  # the git tag vX.Y.Z on the built commit. The only job with contents: write, and it gets no registry credentials.
  # The notes compare the manifest with the previous release's and list the pull requests merged since (GitHub's
  # generated notes). A failure leaves the run red (and opens the "Build failed" issue on a scheduled run); "Re-run
  # failed jobs" finishes the Release: the script creates what is missing and refuses, without changing anything, what
  # exists but differs.
  release:
    needs: [build-test, publish]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # generate the notes, create the draft Release and its asset, publish it (creates the git tag)
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.publish.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release
      - name: Check the manifest describes what was published
        env:
          EDGE_DIGEST: ${{ needs.publish.outputs.edge_digest }}
          GEN_DIGEST: ${{ needs.publish.outputs.gen_digest }}
        run: |
          if ! jq -e --arg v "$VERSION" --arg c "$COMMIT" --arg e "$EDGE_DIGEST" --arg g "$GEN_DIGEST" \
            '.version == $v and .commit == $c and .images.edge.digest == $e and .images.gen.digest == $g' \
            "$RUNNER_TEMP/release/manifest.json" >/dev/null; then
            echo "release-manifest is not the manifest of $VERSION ($COMMIT, edge $EDGE_DIGEST, gen $GEN_DIGEST)" >&2
            exit 1
          fi
      # The previous release (the highest published vX.Y.Z below this version), its manifest.json when it has one
      # (none: the notes of a first release, with complete lists) and the pull requests merged since its tag.
      - name: Previous release and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh notes-inputs "$VERSION" "$COMMIT" "$RUNNER_TEMP/notes-inputs"
      - name: Release notes
        run: |
          inputs="$RUNNER_TEMP/notes-inputs"
          args=(--manifest "$RUNNER_TEMP/release/manifest.json" --prs "$inputs/prs.md" --out "$RUNNER_TEMP/notes.md")
          if [ -f "$inputs/previous.json" ]; then
            args+=(--previous "$inputs/previous.json")
          fi
          if [ "${VERSION##*.}" = 0 ]; then # X.Y.0: the Upgrading note of its CHANGELOG.md section, and a link to it
            args+=(--changelog CHANGELOG.md)
          fi
          python3 scripts/release_notes.py notes "${args[@]}"
          echo "::group::release notes"
          cat "$RUNNER_TEMP/notes.md"
          echo "::endgroup::"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release.sh "$VERSION" "$COMMIT" "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/notes.md"
          echo "released [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # A failed scheduled run opens a "Build failed" issue (unless the workflow already has one open); the next
  # successful scheduled run closes it. A cancelled job counts as failed: that is how a job that hit its
  # timeout-minutes ends, and a build that hangs every day must not go unnoticed. (A run superseded in the
  # concurrency queue starts no job, so it never gets here.) Only issues opened by this workflow's token
  # (github-actions[bot]) count, so an issue anyone can open with the same title does not mute the alarm. Only fixed
  # text and the run's URL go into the issue.
  report:
    needs: [resolve, build-test, publish, release, keepalive]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open and close the "Build failed" issue
    steps:
      - name: Open or close the "Build failed" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Build failed"
          open=$(gh issue list --state open --author 'github-actions[bot]' --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number")
          echo "job results: $RESULTS; open issue: ${open:-none}"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              if [ -z "$open" ]; then
                gh issue create --title "$title" \
                  --body "The scheduled build failed or timed out: $RUN_URL. It is closed by the next successful scheduled build."
              fi ;;
            *)
              for n in $open; do
                gh issue close "$n" --comment "The scheduled build passed again: $RUN_URL"
              done ;;
          esac

  # Keep-alive (scheduled runs only): GitHub disables the scheduled workflows of a public repository after 60 days
  # without repository activity, which would stop the daily build and its own freshness alarm together, silently.
  # This re-enables both workflows on every scheduled run. GitHub does not document whether enabling an enabled
  # workflow resets the 60-day timer; it is the mechanism keep-alive tools use, and external monitoring of the
  # published images is the backstop (both described in the maintenance docs). No commits are made (main is
  # protected). A failing call fails this job, and the report job turns that into a "Build failed" issue.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # PUT /repos/{owner}/{repo}/actions/workflows/{id}/enable
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in build.yml freshness.yml; do
            gh api --method PUT "repos/$GH_REPO/actions/workflows/$workflow/enable"
            echo "enabled: $workflow"
          done
