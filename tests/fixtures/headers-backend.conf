# Test backend (plain nginx image) for tests/hardening_smoke.sh and tests/split_smoke.sh. "/" sends the headers that
# reveal backend software, which the edge must hide; "/app-headers" sends its own security headers, which the edge
# must keep instead of adding a second, different value; "/index.html" is the image's static welcome page;
# "/forbidden" and "/not-acceptable" are the backend's own (stock nginx) error pages for two deny statuses.
server {
    listen 80 default_server;
    default_type text/plain;

    location / {
        add_header X-Powered-By "PHP/8.3";
        add_header X-AspNet-Version "4.0.30319";
        add_header X-AspNetMvc-Version "5.2";
        return 200 "headers-backend\n";
    }

    # A static HTML file: its Content-Length, ETag and Last-Modified must pass the edge unchanged.
    location = /index.html {
        root /usr/share/nginx/html;
    }

    location /forbidden {
        return 403;
    }

    location /not-acceptable {
        return 406;
    }

    location /app-headers {
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
        return 200 "app-headers\n";
    }
}
