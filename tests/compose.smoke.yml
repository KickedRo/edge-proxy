# Compose file for tests/split_smoke.sh: nginx-proxy's "separate containers" layout with the edge and gen images.
# Not meant to be run by hand: the script sets the variables below, a unique project name per run, and cleans up.
#   EDGE_IMAGE, GEN_IMAGE, RUN (unique suffix for container names and the nginx container label),
#   BACKEND_IMAGE, HEADERS_BACKEND_IMAGE, HTTP_PORT / HTTPS_PORT (host ports on 127.0.0.1; empty = Docker picks one).
volumes:
  nginx_conf:
  nginx_vhost:
  nginx_certs:
  nginx_htpasswd:
  nginx_errors:
  nginx_dhparam:

networks:
  proxy:

services:
  nginx-proxy:
    image: ${EDGE_IMAGE:?}
    container_name: ${RUN:?}-edge
    networks: [proxy]
    ports:
      - "127.0.0.1:${HTTP_PORT:-}:80"
      - "127.0.0.1:${HTTPS_PORT:-}:443"
    environment:
      MODSEC_RULE_ENGINE: "On"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - nginx_conf:/etc/nginx/conf.d:ro
      - nginx_vhost:/etc/nginx/vhost.d:ro
      - nginx_htpasswd:/etc/nginx/htpasswd:ro
      - nginx_certs:/etc/nginx/certs:ro
      - nginx_dhparam:/etc/nginx/dhparam:ro
      - nginx_errors:/usr/share/nginx/html/errors:ro
    labels:
      # Per-run label instead of the default one: the gen container is told to look for it, and other
      # nginx-proxy / docker-gen setups on a shared Docker host cannot pick this container as "their" nginx.
      - ${RUN:?}.nginx=true

  nginx-proxy-gen:
    image: ${GEN_IMAGE:?}
    container_name: ${RUN:?}-gen
    # No network at all: it only reads the Docker socket and writes files.
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NGINX_CONTAINER_LABEL: "${RUN:?}.nginx"
      DHPARAM_SKIP: "false"
      TRUST_DOWNSTREAM_PROXY: "false" # no trusted proxy in front in this test; also silences the entrypoint's warning
      # Real deployments: the entrypoint writes the resolvers of gen's own resolv.conf into nginx's "resolver". Under
      # network_mode none that file holds the host's resolvers, not Docker's 127.0.0.11, so set RESOLVERS explicitly
      # to the resolver nginx should use.
    # No command: the image's default command runs, only the label above is set.
    volumes:
      # Rootful Docker's socket path; rootless Docker and Docker Desktop use another one.
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_conf:/etc/nginx/conf.d # written by docker-gen
      - nginx_vhost:/etc/nginx/vhost.d:ro
      - nginx_htpasswd:/etc/nginx/htpasswd:ro
      - nginx_certs:/etc/nginx/certs:ro
      - nginx_dhparam:/etc/nginx/dhparam # written by the entrypoint (RFC 7919 group copied in)
      - nginx_errors:/usr/share/nginx/html/errors:ro

  whoami:
    image: ${BACKEND_IMAGE:?}
    container_name: ${RUN:?}-whoami
    networks: [proxy]
    environment:
      VIRTUAL_HOST: app.example.com

  # Backend that sends headers of its own (version headers the edge hides, see tests/fixtures/headers-backend.conf).
  headers:
    image: ${HEADERS_BACKEND_IMAGE:?}
    container_name: ${RUN:?}-headers
    networks: [proxy]
    environment:
      VIRTUAL_HOST: headers.example.com
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./fixtures/headers-backend.conf:/etc/nginx/conf.d/backend.conf:ro

  # Second backend, to carry the deliberately broken vhost snippet. The script activates every profile
  # (--profile '*'), so "up --no-start" creates it with the others and "down" removes it; the test starts it only when
  # it needs it.
  broken:
    image: ${BACKEND_IMAGE:?}
    container_name: ${RUN:?}-broken
    profiles: [broken]
    networks: [proxy]
    environment:
      VIRTUAL_HOST: broken.example.com
